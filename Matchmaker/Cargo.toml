[package]
name = "Matcher"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = "1.0.2"
axum = "0.8.8"
tokio = { version = "1.49.0" , features = [ "full" ] }
tower = "0.5.3"

uuid = { version = "1.19.0" , features = [ "serde" , "v4" ] }
chrono = { version = "0.4.42" , features = [ "serde" ] }

async-trait = "0.1.89"

serde = { version = "1.0" , features = [ "derive" ] }
serde_json = "1.0"

tracing = "0.1.44"
tracing-subscriber = "0.3.22"

thiserror = "2.0.17"
anyhow = "1.0.100"

[dev-dependencies]
mockall = "0.14.0"